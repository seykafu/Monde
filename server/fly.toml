app = "monde-mind-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"  # relative to this file; deploy with the repo root as context: flyctl deploy . -c server/fly.toml

[deploy]
  release_command = "node server/dist/db/migrate.js"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  MONDE_ENV = "staging"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
