name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:content
      - run: npm run scenes
      - run: npm test
      - run: npm run verify:puzzles
      - run: npm run build
      # Compiles the Electron main process and preload; packaging (electron-builder) is not run in CI.
      - run: npm run desktop:compile
      - run: npm run smoke:server
