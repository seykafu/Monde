# Every home in Monde (GDD Appendix A.1.3, A.3.4 rule 1, A.6; Kasey's D3 for M-03): the 123 lived in on Day 1 and
# the 61 vacant, 184 in all. Each has an address, the A.3.4 attributes (beds, ground_floor, bench) and a host, where
# it stands (shared/src/census/homes.ts):
#   { building: x }  inside the building on its zone's board whose id is x or whose `home:` names x (its door);
#   { lane: [x, y] } on a street the board doesn't draw: residents walk to that edge cell and step off;
#   offboard         in a zone with no board yet (Millbrook, Station Hill).
# Every id here is registered in places.yaml, and the content linter keeps the two (and the zone files) in step.
# Vacant houses keep their numbers (vacant_house_47 is No. 47 Lamplighter Lane, as the Dawn Report prints it) and
# the beds the arrivals have always seen (three in the Old Quarter, two on the Wharf).
