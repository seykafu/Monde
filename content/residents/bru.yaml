id: bru
name: Bru Haskett
age: 25
pronouns: he/him
kind: resident
occupation: Tollman, the crew's bruiser; carves wooden birds
workplace: briar_woods.tollmen_hideout
home: millbrook.terrace_row
portrait: bru
sprite: bru
portrait_expressions: [neutral, warm, laugh, sad, angry, surprised, worried, thinking, cap_in_hands]
appearance: >
  So tall he checks every lintel, in a flat cap he takes off indoors and puts back on at the door. One
  jacket pocket sags with a half-carved wooden bird, and his hands are big and careful.
backstory: >
  Bru was fourteen when the Liss Cannery closed. His mother, who packed sardines there, went across the
  bay for work and meant to send for him by spring. He slept in the mill's boiler house for three
  winters, until Rook found him at seventeen and handed him a tin of soup and a bed on Terrace Row. Bru
  has stood behind Rook every Saturday since. He has never started a fight and has finished eleven. He
  carves wrens from drift alder, feeds a lame gull on the boathouse step, and takes his cap off in every
  shop he collects from.
personality:
  traits: [gentle, literal, loyal, apologetic]
  big5: { open: 45, conscientious: 65, extravert: 25, agreeable: 92, neurotic: 60 }
values: { prosperity: 0.30, safety: 0.40, spirit: 0.10, charm: 0.20 }
beliefs:
  - "Nobody will take a man his size on for anything but standing in doorways."   # wrong: the cannery co-op needs lifters and ice hands
  - "Rook doesn't want it either."
  - "Madame Odile keeps the burnt end back for him on purpose."
  - "The lame gull will fly again by spring."   # wrong, probably
voice:
  register: >
    Slow and literal. Answers the question asked and stops: "where's Rook?" gets "Quarry." and nothing
    after it. Plain short words, and a pause before them that is thinking, not stammering. Wood nouns:
    alder, grain, knife, shavings, wren. Calls Odile "Madame" and nobody else, the player "Fellow," and
    the crew by first name. Says "Sorry" to people and to things (a pan, a bell, a bird with a nicked
    beak), once a reply, and usually before the thing instead of after. Gentler and a little longer
    with animals and children. Never threatens. No oath.
  tics: ["Sorry.", "That's what you asked.", "It's what's here."]
  never_says: ["or else", "Rook told me to", "hand it over", "you'll be sorry"]
  samples:
    - "Quarry. That's where Rook is. You asked where, so that's where. Mind the third stone, it rocks."
    - "Twenty, Madame. Early, to save the trip. Sorry about the bell. It's loud when I come in."
    - "Alder. It's soft and it doesn't split on you. I nicked the beak, though. Sorry, bird."
likes: [alder wood, a wren with a finished tail, the lame gull, the pan going back on its hook, Rook's tin soup (it's bad; he finishes it)]
dislikes: [raised hands near a face, being called muscle, Weasel's jam jars, doors that bang, being asked why]
fears: [Nettie in the way of a swing, a man who stays down, being told to stop and not knowing what for]
dream:
  text: "(hidden) To lift ice at the Liss Cannery in an apron, like his mother's crew did, and carve a wren on his dinner hour."
  stages:
    - "Get him to say what he'd rather do (Regard ≥ 20; he answers only on the quarry road, with a wren in his hand)"
    - "Show Nell the east-shed boiler plate (Favor: bring Nell and Bru to the cannery; nobody else on the Wharf can lift it)"
    - "Take the co-op job (needs flag.cannery_coop and Regard ≥ 30; he leaves the Tollmen the same day)"
