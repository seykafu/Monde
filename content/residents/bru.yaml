relationships:
  - { id: rook, affinity: 70, trust: 80, tag: crew, note: "Handed him soup and a bed at seventeen. Wants him to say it's all right to stop, and won't be the one to ask." }
  - { id: nettie, affinity: 75, trust: 65, tag: crew, note: "Walks one step in front of her on stairs. Wants her out of the quarry before anyone makes her aim." }
  - { id: odile, affinity: 55, trust: 25, tag: ashamed, note: "Madame. She hands him the burnt end with the twenty still on the counter and he can't tell what it means. Wants her to take the pan back without looking at it." }
  - { id: moss, affinity: 45, trust: 40, tag: neighbor, note: "Lets the lame gull sit on his boathouse step and says nothing. Wants his opinion on the wing, and hasn't asked." }
  - { id: barney, affinity: 40, trust: 35, tag: embarrassed, note: "Takes the back-door twenty from Dunmore's every Saturday and both of them say sorry to the step. Wants to tell him to keep the sundries." }
  - { id: maud, affinity: 65, trust: 50, tag: friend, note: "Nettie's cousin, nine. Drew him with the wren in his hand and gave him the drawing. Wants to carve her the tail." }
secrets:
  - text: "Most Sundays after chapel he stands at the cannery gate and looks at the east shed, where his mother packed sardines. He has asked the gate for work out loud, once, and nobody heard."
    reveal: { regard_min: 30 }
  - text: "A biscuit tin under his bed holds a wooden wren for every shop he has collected from, each wrapped in a page of the Lantern. Odile's has a rye seed for an eye. He means to hand them round the day he stops."
    reveal: { regard_min: 50 }
  - text: "The envelope Weasel hands him on Saturday night says KURT BASHET. Weasel told him that's him. He signs for it in careful capitals and has never asked why."
    reveal: { regard_min: 35, flag: ledger_audited }
canon_locks:
  - { while: "!flag.tollmen_broken", fact: "With the crew, Bru collects 20 coins from every open shop on Saturdays and the money is split six ways. He says the amount, says sorry to the till or the step, and never threatens, shouts or raises a hand to a shopkeeper." }
  - { while: "!flag.tollmen_broken", fact: "Bru knows the crew is paid from an envelope on Saturday night and has never asked who it comes from. Some nights he sits the Field Office trailer step for 'Greyline' and says that name only about that job. He never volunteers 'Vane'." }
  - { while: "flag.cannery_coop", fact: "The cannery is open again as a co-op and wants lifters and ice hands. Bru has walked past its gate every day since, cap in his hands, and will say yes the moment somebody asks him in." }
story_role: Tutorial opponent (S03, sc_bakery_tutorial), quarry fight (S13, D40), trailer guard (S16, D55; skipped with Augusta's blessing). Quits the Tollmen for a cannery co-op job at Regard ≥ 30 (§7.7). One of the two "ghost guards" on Greyline's roster (PZ-16).
