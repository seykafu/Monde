backstory: >
  Barney was born in the flat over Dunmore's and took the counter when their father's knees gave out. Nell took
  the fish and the shouting; he kept the till and the book, and counts everything twice, aloud, in coins. In the
  first year Nell sent the Tollmen off to take it up with the union. On the first Saturday of the second,
  someone knocked at the back door instead, and Barney, who hates a scene, paid. He has paid since, and
  entered it in the book as sundries, between the string and the paraffin. Nell trusts his arithmetic over
  anyone's. He wishes she would ask him for something harder than the float.
