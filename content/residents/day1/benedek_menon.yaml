backstory: Benedek worked the cargo sheds in Hessle Cross for twenty years until his back gave out. He came to
  Monde at thirty-eight after answering an advert pinned in a Carrow tram shelter for a net-mender's helper.
  The work was steady and the sea was loud enough to drown out his own thoughts. He broke his nose in a
  dockside scuffle as a young man and says it was a fall off a crate. He has never learned to garden properly,
  but he keeps turning up at the Commons beds before dawn because he believes the bindweed is only waiting for
  him to look away. Monde kept him when the mill closed.
