backstory: Solveig sewed alterations for a department house in Hessle Cross for fifteen years, until her
  husband Ansgar died of a stubborn lung infection and the work stopped meaning anything. She sold their flat
  and took the cheap ground-floor room on Shore Lane because a friend's letter said the sea air helped the
  nerves. Twenty-seven years on she still finds the ferry timetable on the wall and writes the fares down out
  of habit. Her one regret is a ship's flag she once offered to sew for the Gannet and never did. She
  believes the Gull's cider is too sweet and that the tap in her kitchen drips to spite her.
