backstory: "Maurice kept the light at a rock station off the northern coast for twenty-six years, alone for
  most of the winters, with a radio that only worked when the wind allowed. He came to Monde at sixty-three
  because the Monde light was the one he could see from the ferry the first time he crossed, and he wanted to
  be near a lamp that still turned. He has been wrong about the Monde light for years: he insists the lens
  bearing is fine and blames the lack of oil, when in truth nobody has tried the mechanism since the keeper's
  post was sold off."
