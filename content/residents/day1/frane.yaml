backstory: >
  Dolly was born in the house on Lower Row where her father mended bicycles and wirelesses, and has had a bench
  in its back room since she was fourteen. She spent thirty years repairing sets and church clocks for a firm
  in Hessle Cross, home on Saturdays, and came back for good when the firm folded. She mends whatever is
  brought round and is paid in tea, cake or nothing. Most of the town has quietly stopped listening, and she
  minds. Her sister across the bay writes that she should come to Carrow; Dolly writes back every second
  Sunday and never says no.
