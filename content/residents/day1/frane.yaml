backstory: Dolly spent thirty years repairing wirelesses and church clocks for a firm in Hessle Cross, where
  she was known for fixing sets nobody else would touch. When the firm folded she came home to Monde, where
  she was born, and took the back room on Lower Row because it had a window that caught the morning light for
  her bench. She still feels guilty about leaving her sister's family behind in Carrow, and she writes to them
  every second Sunday without fail. She is certain the town's wirelesses could be repaired and returned to
  every house if only people would bring them in, though most residents have quietly stopped listening at all.
