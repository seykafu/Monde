backstory: Elin sewed hems and christenings for forty years in Hessle Cross, first in a shop with her sister
  and later from her own front room. When her husband Arne died she found the city too loud to think in, and
  at seventy she took the ferry to Monde with two suitcases and a sewing box. Shingle Row had a ground-floor
  room going cheap. She still has the trunk she brought up from the boat, and she has never opened the bottom
  of it. She says she came for the quiet, which is partly true. The rest was a letter from her sister that she
  has not answered in eighteen years.
