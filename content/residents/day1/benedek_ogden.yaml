backstory: Benedek came to Monde at twenty-six to set looms at Lissworth Mill, after a long apprenticeship in
  a Carrow weaving shed. He liked the steady rhythm of the frames and the pay that came every Friday. When the
  Mill closed fourteen years ago he took casual repair jobs and boathouse shifts, and he has kept a wooden box
  of loom spanners under the stairs ever since. He stayed in Monde for Anders, whom he met at the chapel fête
  the year he arrived. Benedek still believes the Mill could run again if someone asked the right people,
  which the town has heard from him many times.
