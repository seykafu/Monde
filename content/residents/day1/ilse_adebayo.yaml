backstory: Ilse grew up in a rented flat above a chandler's in Hessle Cross and learned early that a shop lives
  or dies on its margins. She came to Monde at thirty after a marriage ended, drawn by cheap rent on Tower Lane
  and the quiet. She lodges in Hessle Cross Tuesday to Friday at a desk handling invoices for a wholesale
  haberdashery, home on Friday's ferry. Every Saturday she walks the Row and counts the shuttered windows, sure
