  Fournier & Fille. He loved the four a.m. start, the first loaf out, the smell that reached the harbour. A
  lung complaint from years of flour dust, and a bad fall in the bakery's cellar, ended his work early. He
  never told Benedek how much the quiet hurt him, and he still bakes small batches at home for the lane. He
  stayed in Monde because Benedek would not leave, and because the bread he made here fed people who had
  nothing else.
