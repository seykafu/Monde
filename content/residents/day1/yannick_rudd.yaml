  sweeping fibre from the frames. The dust got into his chest and the mill closed fourteen years ago, so he
  came home to the flat above Market Row with his tools and a pair of old field glasses. He had meant to leave
  for Carrow once, but his mother needed him, and then she died in the flat, and he stayed. Mornings on the
  footbridge gave him a reason to get up. He is sure the herons have stopped coming because of the new fishing
  boats, though he has never actually counted them before the boats arrived.
