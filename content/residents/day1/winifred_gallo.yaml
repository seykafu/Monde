backstory: Winifred ran a bakery in the back streets of Carrow for nineteen years before the rent doubled and
  her knees gave up on the early hours. She came to Monde at forty-three after answering a card in the Lantern
  window about a flat above a shop. Odile tasted her rye within a week, because the bread from her old ovens had
  been sold in Hessle Cross and someone remembered it. Winifred bakes in the flat's own oven for the Saturday
  market, and Odile still checks her loaves. Her one regret is a sourdough starter she left behind in Carrow,
  which she still thinks about when the rye goes flat.
