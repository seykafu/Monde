backstory: >
  Ferdinand came to Monde at twenty-one with a borrowed cape and a suitcase of coins that kept vanishing, which
  he took for a sign. For thirty years he toured the Carrow fairgrounds, billed once as The Marvelous Marchetti
  and never quite a headliner. Three assistants came and went, each leaving with a little less patience; the
  props trunk is the only one who stayed. He settled upstairs on Bell Row for the afternoon light off the
  water, and because nobody in Monde has ever asked him to explain a trick. He wants one more full house, and a
  young pair of hands to leave the Great Trick to.
