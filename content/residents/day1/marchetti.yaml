backstory: Ferdinand came to Monde at twenty-one with a borrowed cape and a suitcase of coins that kept
  vanishing, which he took as a sign. He toured the fairgrounds of Carrow for years, billed once as The
  Marvelous Marchetti, and was never quite a headliner. His assistants came and went, three of them in all,
  each leaving with a little less patience. The props trunk is the only one that stayed. He settled on Bell
  Row because the upstairs flat had a window that catches the light off the water in the afternoon, and
  because nobody in Monde asked him to explain a trick. He believes the town would fill again if only someone
  gave it a proper show.
