backstory: >
  Thora and Liv sat at the same desk in the old Wharf school and have not been apart for a month since, until
  the rope-walk in Hessle Cross offered wages the Wharf could not. She takes Tuesday's ferry out and Friday's
  back, counts three hundred pay packets on Thursdays, and writes Leonie every Wednesday, a letter that rides
  home on the same boat as she does. If the cannery ever opens as Nell's co-op it will need a clerk. Thora has
  said so over the fence for two springs, and Nell has only said, "Look."
