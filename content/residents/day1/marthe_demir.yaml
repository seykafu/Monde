backstory: >
  Marthe's mother was a ward sister in Carrow and pinned her watch upside down to read it while she took a
  pulse. Marthe wears the watch the same way and has never taken a pulse in her life. She keeps the Town Hall
  registers with a steel nib, and has sat at the next desk to the Mayor for nine years and knows her lunch at
  Café Liss to the minute: eleven minutes, a ledger propped against the teapot. She wants Mayor Pell to sit
  through a whole hour: a plate, a chair, no ledger. Mei says she should take the hour herself. Marthe says she
  has a register.
