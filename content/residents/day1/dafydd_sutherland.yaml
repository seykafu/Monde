backstory: Dafydd came to Monde at twenty-two from a weaving town up the coast, signed on at Lissworth Mill,
  and set looms there for nearly thirty years. He could tell a bad pick by the sound before the cloth showed
  it. When the mill closed fourteen years ago he took the packing of the frames personally and still walks
  past the gates most mornings. He has done odd repairs for the boathouse and Kasimir since, but nothing with
  a wage that lasts. He stayed because Monde is where his friend was, and because a mill town is the only sort
  of place he knows how to be useful in.
