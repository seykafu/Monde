backstory: >
  Kester sits his post lessons at Margo's library desk and on Saturdays turns up at Fournier & Fille to
  scrub trays, unasked and unpaid, for the day-old heel. He sweeps, carries and says "not hungry" through a
  mouthful of crust. Odile has never hired him and never sent him off, and she has never told him he is
  doing anything right. She says "Hm." He has decided that means no. What he wants is to hear "again", which
  is what she says to a loaf she means to keep. His mothers think he is saving for Carrow. He is saving for
  a cane proving basket.
