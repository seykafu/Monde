backstory: "Hester came to Monde at 36 from a department store in Carrow where she ran the haberdashery
  counter. She had saved for a shop of her own and found the Market Row premises cheap because the mill was
  failing. Her first year was thin: she sold mending and buttons out of a cardboard box until a neighbour
  asked for coffee. She switched the box for a counter and a kettle. The café has kept her solvent for
  twenty-three years, which she considers proof of sound judgement, though the Tollmen's Saturday visits still
  rattle her. Her husband stays in Hessle Cross during the week because the pay there is steadier, and she has
  never quite forgiven the arrangement."
