backstory: >
  Hester came to Monde at thirty-six from the haberdashery counter of a Carrow department store, with a tape
  measure round her neck and a cardboard box of buttons. The mill still ran three shifts then. She sold
  buttons and mending from the box until a neighbour asked for a coffee, so she bought a kettle and a counter,
  and Café Liss has paid its way for twenty-three years. She drinks only tea. Lucien clerks at a Hessle Cross
  desk on weekdays so the cottage and the café can both be paid for, and she has never forgiven the sums that
  make him. She wants him home on a Tuesday.
