backstory: Karim set looms at Lissworth Mill for nineteen years, first as a fitter's boy and then as the man
  the floor leads sent for when a shuttle jammed. He came to Monde at seventeen after a bad winter in
  Carrow, following a cousin who promised work at the Mill. When the Mill shut he got three more years on
  the cannery line before the Liss Cannery went the same way. His sister kept the flat from sinking into
  debt while he learned to take whatever odd job came up. He still walks past the Mill yard most mornings,
  though he tells himself it is only the shortest way to the harbour.
