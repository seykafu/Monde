backstory: >
  Alphonse clerked at a Carrow rail office for twenty years, filing timetables for lines that later closed, and
  retired at forty-two after a bad winter on his chest. He came to Monde on a whim because a notice said a
  cottage by the duck pond was going cheap. It was damp, the town was half empty, and he loved it at once. He
  counts the pond every morning with a flask and a notebook and posts the numbers to a bird society in Carrow
  that has never replied in person. Three springs ago he saw something in the reeds below the footbridge. The
  society wrote back: unconfirmed. He wants a second pair of eyes.
