backstory: Dunstan came to Monde at nineteen to take a junior post at the Town Hall, after a year of clerking
  for a cotton merchant in Carrow that he found tedious. He has stayed forty-three years. He ran the Harvest
  Supper committee for two decades and the minutes for longer. His wife Lena left for Hessle Cross in the year
  the mill shut, and he never followed her, though he still sends her a card each Christmas. Mayor Pell asked
  him, years ago, to keep one archive drawer locked and to leave it unread. He has honoured that for longer
  than either of them expected.
