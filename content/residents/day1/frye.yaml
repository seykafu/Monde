backstory: >
  Dunstan came to Monde at nineteen as a junior clerk at the Town Hall and became the town clerk in his
  thirties. Eleven years ago the council folded the post into the mayor's and kept him on in the basement as
  archivist, with the key. His wife Lena left for Hessle Cross the winter the mill shut and sends a card at
  Christmas, which he files. Mayor Pell once asked him, plainly, to leave one folder alone. It is the only
  request in forty-three years he has not minuted. He would like her to say that it can be opened, or that it
  never need be.
