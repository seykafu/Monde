backstory: Born in Monde above the old cooperage on Lamplighter Lane, Alma spent thirty years on the Mill
  Hands' committee before a stroke retired her from the union table. She took the sexton's post when the
  rectory closed and moved into the chaplain's rooms with one bed, a kettle and forty years of minute books.
  Her one failure was the Harvest Supper two years ago, which ran out of bread at seven and never recovered
  its name. She stayed because the town still needs someone to write things down, and because nobody else
  would count the volunteers.
