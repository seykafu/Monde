backstory: >
  Alma was born over the cooperage on Lamplighter Lane and has never lived further than a bell rope's length
  from St Brigid's. The parish could afford one salary and found one woman who would take the chaplain's rooms
  and the sexton's keys together, so she holds both. Her sermons run six minutes by the vestry clock. Every
  Monday she empties the poor box and carries the envelope marked Mercer, Millbrook to the terrace door, where
  it is taken on the step and the door is shut. In all those Mondays she has not once been asked in. She would
  like to be asked in for tea, once, and stay for the whole pot.
