  and the same farmers' wives every spring. When the Row emptied he kept his tape measure and his scarf and
  very little else. He moved in with Edmund on Shingle Row twenty years ago and has stitched every torn
  cushion in the place since. He once sewed a jacket for a visiting ferryman who never came back for it, and
  it still hangs on the back of the door. He believes the Tollmen collect their fee so the shops can stay open
  a little longer, which nobody has ever confirmed.
