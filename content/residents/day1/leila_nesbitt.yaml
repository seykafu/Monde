backstory: >
  Leila came to Monde forty-one years ago, three months before Elke, to cook the Lissworth canteen: three
  hundred dinners by a quarter past twelve, from two stoves and a sack of potatoes. She has not stopped counting
  portions since. The canteen's forty-quart pots are still in the mill's back kitchen. She wants Corentin Frazer
  to unlock the door and let her fetch them for the Harvest Supper, and he says "Not yet." The flat on School
  Lane has nineteen stairs, and her knees have counted every one.
