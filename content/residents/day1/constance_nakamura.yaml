backstory: Constance sewed for a dressmaker's in Carrow for twenty years before her husband Tomas took the
  post at Lissworth Mill, and the two of them moved out to Monde when she was fifty. Tomas died six winters
  ago, and she still keeps his thermos in the hall cupboard though it has not held tea since. She opened the
  sewing room at the back of the house to whoever wanted a hem taken up, and most of the street came. She
  believes the ferry timetable was kinder when she was young, which is not quite true, and she thinks the
  young people on Mill Lane have forgotten how to be still.
