backstory: Vera was born on Lower Row and trained as a seamstress at the mill office's tailoring room before
  the frames went quiet. She sewed uniforms for the mill girls for thirty years and afterwards took in a little
  mending from her own street. Her husband Alwyn died of a winter chest the year before the cannery closed, and
  she has kept his boots by the back door ever since, never moved. She stayed in Monde because she
  could not picture her own kitchen anywhere else, though she tells people it was the price of the rent. She
  thinks the Gannet ought to run to Carrow every day, and she is quietly sure the mill will reopen one spring.
