backstory: Vera was born on Lower Row and trained as a seamstress at the mill office's tailoring room before
  the frames went quiet. She sewed uniforms for the mill girls for thirty years and later took in alterations
  from half the town. Her husband Tom drowned off the breakwater the winter before the cannery closed, and she
  has kept his thermos hanging by the back door ever since, never filled. She stayed in Monde because she
  could not picture her own kitchen anywhere else, though she tells people it was the price of the rent. She
  believes the Gannet still runs to Carrow every day, and she is quietly sure the mill will reopen one spring.
