backstory: Birgit sewed for a tailoring house in Carrow for nineteen years, mostly wedding hems and the
  occasional funeral coat. When her husband Tomas took a post at the Carrow docks, they rented a flat near the
  tram sheds, but the noise wore him down, and they bought a cheap terrace house in Monde because it was quiet
  and the rent was nothing. Tomas died eight years later, in the front room, with the radio on. She has kept
  the house as he left it, including his pipe rack. She tells people she came for the sea air. She came
  because Tomas wanted a garden, and she never planted one, which she privately regrets.
