backstory: >
  Maud sits at a window desk in Millbrook School, third from the stove, and draws whoever comes through the
  door in the margin of her slate. Mr. Amari pins the best by the coat hooks, which she pretends not to mind.
  She lives on Terrace Row with her father Gideon and her sibling Sol, three doors from Gran Ilona and her
  cousin Nettie, whose hood she has drawn so large it needed a second page. There are nine pupils. She knows
  the number and the date. She has never drawn Nettie's face without the hood, and she would like Nettie to
  take it down for the length of one drawing.
