backstory: Morwenna spent twenty-two years as a steward at Lissworth Mill, arguing rota disputes on the
  factory floor until the frames went quiet. Her lungs gave out before the mill did, so on a doctor's advice
  she took the flat over Café Liss, away from the lint, and never left. She was born in the terraces behind
  Millbrook and knows which doorsteps have been empty longest. Café Liss sits under her window, so she hears
  every complaint about the Tollmen before it reaches the Lantern. She still keeps the union's minute book
  in a drawer, and she still believes that a town run on lists will hold together.
