backstory: Yaa trained as a draughtswoman in Carrow and spent her first working years surveying harbour depths for a
  shipping office there. She came to Monde at twenty-two to draw the coast for a dull commission and never
  left. Her first Saturday stall was a bet with a fishwife who said nobody would pay for a map of their own
  street. Eleven maps sold that morning. She still keeps the coin from the first sale in her raincoat pocket
  and shows it to anyone who asks about the Lower Row houses. Her husband wanted to move back to the city; he
  is buried in St Brigid's yard now, and she does not discuss it.
