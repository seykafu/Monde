backstory: Camilla sewed hems and wedding dresses in Carrow for twenty years before a bad winter cost her the
  shop lease. She came to Monde at 46 on the Gannet with one trunk and a sewing machine she still uses. She
  taught half the girls on Well Row to hem a skirt, and she says the mill would have had her if the mill had
  lasted. Her husband Tom left her in the second year, and she never bothered to be cross about it. She keeps
  a tin of buttons from every coat she ever altered and will not say why.
