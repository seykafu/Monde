backstory: Edda worked the winding floor at Lissworth Mill from sixteen until the lungs gave out at
  thirty-nine. She tells people it was the dust, which is true, but the doctor in Carrow also blamed her habit
  of climbing the frames without a mask. When the mill closed she had a choice of a flat in Carrow or the flat
  her late mother left on Well Row, and she chose Well Row because her brother had already moved in and she
  could not let him run the place alone. She still keeps the mill's old shift bell on the windowsill.
