backstory: Gerrit worked the signals at the Liss branch for twenty-two years, until Monde Station lost its
  stop nine years ago. He came to the town at forty-seven, when a job at a Carrow depot ended. His wife
  Anneke liked the sea and he liked her, so he stayed on after she died, in the house on Station Road that
  still smells faintly of her lavender soap. He keeps a log of every train that once passed through, in a
  ledger he is sure someone will want one day.
