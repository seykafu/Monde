backstory: Came to Monde at 14 when her mother took a post at the cannery, and she worked the line there from
  sixteen until it closed eleven years ago. She married Idris in her twenties and has kept the house on Tower
  Lane ever since. Since the cannery shut she has taken in mending and the odd alteration, and she is waiting
  on a place at the Carrow post office that she has not yet heard back about. She tells people she is happy
  here, and mostly she is. She is less sure the town will still be here when her own children would have
  needed it.
