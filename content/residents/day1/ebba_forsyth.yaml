backstory: >
  Ebba went aboard at sixteen as galley hand and has cooked the crew's fish stew every working morning since,
  apron on, in all weathers. She married Rohan on the cannery bunkhouse steps the spring the cannery shut. They
  have saved toward a boat for nine years, and she has bought one coil of good rope every spring, so the shed
  holds forty fathoms and no hull. There is a stripped hull on the boathouse rack. She wants Ruth Doherty to
  hold it for her until Regatta week, and to say nothing to Rohan.
