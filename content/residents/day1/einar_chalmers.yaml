  spent twenty-two years on the frames until the mill closed fourteen years ago and took six hundred jobs with
  it. He tried retraining in Carrow and hated the clipboard men who ran the course, so he came home. Now he
  hauls post and crates along the wharf and out to the far houses. He keeps his father's tin mug on the hook
