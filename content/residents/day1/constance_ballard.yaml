backstory: Born in the terrace above the harbour, Constance ran the drapery counter in Dunmore's for
  thirty-one years before her knees gave out. She sewed the bunting for every wedding and funeral in the Old
  Quarter and kept a ledger of who owed what, mostly in thread. When the mill closed she thought the town
  would empty in a season, and it did, but slowly enough that she stayed. She married Omar because he was the
  only man in the Gull who laughed at her jokes before she finished them. Her one regret is that she never
  learned to drive the ferry.
