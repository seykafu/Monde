backstory: Anouk spent her working life measuring and cutting cloth in a draper's shop in a mill town inland,
  where she was known for never letting a customer leave with the wrong length. When the inland mill shut she moved
  to Monde to be near a cousin, and found the cousin had gone to the mainland. She kept the lease on the Wharf
  flat anyway and took up the tatting she had always meant to learn. She met Genevieve at a Harvest Supper table and has been arguing
  with her ever since. Her private belief is that Monde would never have lasted without the cannery, though
  the cannery closed eleven years ago and took most of the town's money with it.
