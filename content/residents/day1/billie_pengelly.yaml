backstory: Billie was born in the brick house on Mill Lane and learned to bind from their mother, who did
  sheet-music covers for the bandstand concerts before the bandstand fell in. Billie went to Carrow at
  nineteen to train with a commercial bindery, came back after four years when the mill's wages stopped being
  the only wages worth having, and has been here since. The bindery in Carrow sent a letter asking them back
  once, and Billie still keeps it in the drawer with the awls. Their own work is slow and sells mostly through
  the Gull & Anchor noticeboard and the odd parcel on the Tuesday ferry.
