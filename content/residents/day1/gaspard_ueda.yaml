backstory: Gaspard fished out of Port Sallow on a crabber until his knees gave out at thirty-six. He answered
  the Town Hall notice for a caretaker because it paid a wage and let him keep an eye on the weather from the
  roof. He once rowed a swamped dinghy's crew back to shore in a gale and has never told anyone the full
  story. He came to Monde for the quiet and stayed because Effie liked the view of the breakwater. He still
  believes the clocktower could be fixed with a spare spring, though nobody has let him try.
