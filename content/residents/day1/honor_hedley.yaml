backstory: Honor kept the light at Harrow Point for twenty-two years, winding the clockwork and logging the
  wind every bell. She came to Monde at thirty-one when the Point was automated, and took the rooms on Well
  Row because the sound of the water reminded her of the lamp room. The Point's lamp was replaced by a machine
  that never once had to be wound by hand, and she still resents it a little. Her weather log has been kept
  without a gap for thirty-two years. She stays because Monde is the last town on this stretch of coast that
  still needs someone to read the sky.
