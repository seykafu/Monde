backstory: Pernille was born above the old dry goods on Market Row and sewed hems for the mill girls until the
  mill closed. After that she took the sewing bench at Dunmore's back room for years, mending everything the
  town brought in. Her knees gave out before her eyes did, and she retired early on a small pension. Morwenna
  married her at nineteen in St Brigid's with the tide out. Pernille keeps the flat above the café neat and
  mostly quiet, and she has opinions about everyone's hems. She still sees the Tollmen's men on Saturdays and
  has decided, privately, that they count the till in the wrong order.
