backstory: >
  Corentin went into Lissworth at sixteen as a bobbin boy and was a loom-setter's mate by thirty. When the gates
  shut the owners kept one wage, a man to walk the building at night, and he took it because he could not
  picture another man in there. He winds the gatehouse clock, oils the Number Six loom, and chalks "quiet" on
  the slate by the door at dawn. He has found every part of Number Six but the shuttle. He has not told Signe,
  who has not set foot in the mill since the last shift, because then she would have to come and look. He wants
  her to.
