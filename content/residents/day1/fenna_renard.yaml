backstory: Fenna trained as a seamstress in Carrow and took in alterations for the big department houses there
  until her hands got stiff. She came to Monde at 41 when her husband Piet took a job at the mill, and she set
  up a sewing table in the front window. Piet died in the cold winter eleven years later and she kept the flat
  because the view of the harbour was the only thing he ever asked her to keep. She still thinks the mill
  whistle should sound at six, and she is certain the Gannet's timetable was kinder before the cannery closed.
  She has been asked to take the Well Row quilt in hand twice and never finished it.
