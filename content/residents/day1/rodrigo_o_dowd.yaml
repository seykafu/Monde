backstory: He came to Monde at twenty-nine, when Lissworth Mill was still running three shifts and the frames
  were loud enough to hear from the breakwater. He set looms for ten years and was good at it, quick with a
  spanner and patient with the new lads. When the Mill shut he took what casual work there was, and for a while
  that meant the boathouse and whatever Kasimir could spare. Now he goes across on the Gannet on Tuesday, lodges
  in Hessle Cross, and comes back on Friday's boat, because Hessle Cross pays by the job and Monde pays in
  promises. He stays in Monde because the house is paid for and the tide sounds like something.
