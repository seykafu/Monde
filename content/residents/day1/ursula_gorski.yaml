backstory: Ursula sewed hems and linings in a Carrow tailor's back room for twenty-two years before she came
  to Monde at forty-five, following her husband Piotr to his late uncle's terrace house. Piotr died six
  winters later, and she has kept his thermos on the windowsill ever since, never filled. She says it's
  because the cork sticks. It isn't. She came to Monde because the rent was low and the tide was loud enough
  to stop her thinking. The thing she got wrong was believing the town would empty out slowly enough for her
  to watch it happen from her chair. It emptied faster, and the friends who might have sat with her left on
  the ferry one by one.
