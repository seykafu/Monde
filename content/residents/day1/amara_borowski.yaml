backstory: >
  Amara wove hearth rugs on a borrowed loom over a Marrow Quay net loft until it was sold for its timber. The
  winter Dex and Dom turned eighteen she took them across on the first boat with room for three, found the old
  cannery bunkhouse in a week and took the fish-market job to pay the first quarter. Rook found the lads their
  Saturdays that winter. She leaves porridge on the back of the stove and has never asked how the day went. The
  loom came over in pieces and stands by the bunkhouse stove, with Dom's spoons going on the table beside it.
  She weaves from the market's worn-out twine and posts the rugs to Carrow.
