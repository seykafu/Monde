backstory: Ulla sewed hems and christening gowns for thirty years in a Carrow tailor's back room, and came to
  Monde at fifty-five when her husband Anton's chest gave out and the doctor said sea air. He died the first
  winter, and she stayed because the flat was cheap and the sea kept her up at night in a way she found
  company. She still hears the ferry's horn on Tuesdays and thinks it sounds lonelier than it used to. Her one
  proud thing is a gown she made for Millbrook's last christening, which nobody has mentioned since.
