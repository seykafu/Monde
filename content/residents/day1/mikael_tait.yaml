backstory: Mikael grew up in a mill town on the northern coast where his father ran a plumbing van until the
  lanes emptied. He trained with a firm in Hessle Cross, then went freelance at nineteen, taking any job the
  ferry would carry him to. A burst main in a Monde cellar in his second year got him talking to the town's
  old men about its roofs, and he never left. He met Viggo on a cold job at the harbour, married him that
  year, and they bought the Bell Row flat. He still regrets leaving his first apprentice behind on the
  mainland, and he believes the town will rebuild itself if someone simply starts with the worst roof.
