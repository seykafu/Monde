backstory: Ilona ran the Monde sorting office for thirty-one years, back when the ferry brought the post every
  morning and the mill whistle set the clocks. She knew every hand on every envelope in town. After the mill
  closed she moved to Carrow to be near a son who never quite wrote back, and she came home to Millbrook when
  her husband Tibor died, because the terrace on Row Five was the only place where the kettle always had
  someone to talk to. Her granddaughter Nettie moved in after a bad winter in Carrow, and they have kept the
  house warm between them ever since.
