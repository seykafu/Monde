backstory: >
  Ilona ran the Monde post office for thirty-one years, back when the ferry brought the post every morning and
  the mill whistle set the clocks. She knew every hand on every envelope in town and kept it to herself. Tibor
  died the winter the cannery shut. Her son Gideon lives three doors along with Maud and Sol; her granddaughter
  Nettie lives in the second bedroom and keeps late hours. Ilona counts the coal each morning, mends what she is
  given, and has never asked what the chalk on Nettie's sleeve is for. She is waiting to be told, and would
  rather not be.
