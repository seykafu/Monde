backstory: >
  Signe wove on the second floor at Lissworth for thirty-one years and chaired the floor committee for the last
  nine, which is where the enamel badge came from. After the gates shut she mended boats beside Ruth Doherty,
  because a seam wants the same patience as a selvage. She has not walked through the mill gates since the last
  shift. Corentin walks them every night, and she has never asked what for. She wants him on the day side at the
  boathouse, where she can see him, and has kept the bench beside hers clear for two winters.
