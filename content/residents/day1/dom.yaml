backstory: >
  Dom left Marrow Quay at eighteen with his twin, a cousin and one suitcase, and has talked his way into every
  shop on Market Row since. Dex draws the Saturday round; Dom does the till. He learns the shopkeeper's first
  name, the children's names and what the rain did to the roof, and the twenty is in the tray before the word
  is said. He can't lie to a child, which he tells as a joke. He and Dex drum on an oil drum with wooden
  spoons, not quite together, and Dom has begun to want a proper drum and a place where the noise is the point.
