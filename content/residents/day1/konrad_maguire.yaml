backstory: "Konrad grew up in a mill town two rivers inland and came to Monde at thirty-seven, when the
  Lissworth loom-shop was taking on setters. He set looms for twenty-two years, and his wife Ruthie kept the
  house on Loom Street with a stove that never drew properly. She died in the winter the mill's second shift
  was cut, and he has kept her wooden spoon in the drawer ever since. He tells people the mill closed because
  of the price of cotton. He is half wrong: it was the new owners, and he still hasn't forgiven them. He
  stayed because the terraces were cheap and the weir sounds like the river he grew up on."
