backstory: >
  Dex and Dom left Marrow Quay at eighteen on the first boat that would take them, with their cousin Amara and
  one suitcase between three. Amara found the bunkhouse; Rook, that first winter, found them something to do on
  Saturdays. Dex drew the round on the back of a ferry timetable: six doors, twelve minutes a door, nobody kept
  waiting. Rook has used it ever since. On weeknights Dex plays draughts with Hollis at the Gull & Anchor and
  listens to the branch timetable being recited, which he is learning by ear. He wants to be good at something
  that doesn't happen on a Saturday.
