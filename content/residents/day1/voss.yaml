backstory: Ignatia was born on Heron Lane and left at nineteen to survey railway routes on the mainland. She
  came back when the mill closed, because someone had to finish the town's survey and nobody else would. She
  has walked every street with a measuring chain, and the older lanes have mostly gone from memory. Her mother
  kept a greenhouse on the Commons, and when the glass cracked she taped paper over the panes rather than
  replace them. She sells her maps on Saturdays to the few tourists from Carrow who come on the ferry, and she
  has never once been on time for anything.
