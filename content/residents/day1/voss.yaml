backstory: >
  Ignatia was born on Heron Lane and spent her twenties surveying railway routes on the mainland, home every
  winter. She came back for good when the mill closed, because somebody had to finish the town's survey and
  nobody else would. She has walked every street with a measuring chain, and sells her hand-drawn maps from the
  market hall on Saturdays to the few visitors who stay over from Friday's boat. She is never lost. She is always late;
  she arrives with the right bearing and the wrong hour. Her mother, who died six winters ago, walked a lane
  into Briar Woods as a girl. It is on no map, and Ignatia has not yet gone to look.
