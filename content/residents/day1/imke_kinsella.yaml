backstory: Imke grew up in a mill town inland and took the post office counter job at Liss at nineteen, when
  the branch still had a telegraph key. She married Piet Kinsella, a fitter at the mill, and they came to
  Monde when she was thirty-four because the rent on Tower Lane was low and the sea air was supposed to be
  good for his chest. Piet died eleven winters ago. She ran the Monde sorting office until it closed, then
  kept the letter-box key out of habit. Her one regret is that she never learned to drive the ferry timetable
  by heart, which she thinks makes her look foolish when visitors ask.
