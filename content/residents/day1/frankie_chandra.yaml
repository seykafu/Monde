backstory: Frankie was born in the top room of a Millbrook terrace and sorted the mail under Ilona Szabo at the Monde post office for
  thirty-one years, until the Carrow mail stopped coming on the Gannet. They knew every household's
  handwriting and which letters were bad news before they were opened. Their husband Lee drowned off the
  breakwater before Frankie retired, and they have kept his thermos on the windowsill ever since, though
  nobody has filled it in years. Frankie stayed in Monde when the mill closed because they believe the town
  will turn at the next tide, and because the postmark belongs here. Lately the rooms feel too quiet at
  supper.
