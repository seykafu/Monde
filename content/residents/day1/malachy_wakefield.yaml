backstory: Malachy grew up in a river town near Carrow, where he painted shop signs for a living until the
  chandlery he worked for closed. He drew constantly in the margins of ledgers and ferry timetables. He came
  to Monde at twenty-two with a rucksack of brushes and a half-finished plan to paint the whole Market Row.
  The plan stalled after the first shutter. He met Olwen on a Carrow bus, when his sketchbook slid onto her lap, and married her within a year.
  He still believes the town's walls are waiting for him, though most of them are simply tired.
