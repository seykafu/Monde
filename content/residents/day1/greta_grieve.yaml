backstory: Greta trained as a bookkeeper in Carrow and took a clerk's post there before she was twenty-five.
  At twenty-six she married a ferryman's cousin, Teo's uncle, and moved to Monde for the quiet and the cheaper
  rent on Mill Lane. The marriage ended within four years, but she stayed, mostly because the ferry timetable
  suited her. She still keeps the ledger for the Liss Cannery's old pension fund from her kitchen table,
  though nobody has paid her for it in years. She tells herself the town will come back. She believes the
  Tollmen collect only because people are too polite to refuse them.
