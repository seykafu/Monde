backstory: Lucas ran the sorting office in Carrow for thirty-one years and knew most of the city's street
  names by the handwriting on envelopes. He retired at sixty-eight, the year his wife died, and came to Monde
  because his daughter would not let him live alone above a noisy street. He still remembers what a
  first-class stamp cost in 1958 and will tell you without being asked. He never managed to be a good cook,
  though he tried for Hana's sake, and he was glad when she took over the kitchen. He is slowly losing track
  of the days, and has started to think the post still comes on Tuesdays.
