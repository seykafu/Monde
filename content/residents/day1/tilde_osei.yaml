backstory: >
  Tilde came to Monde at fifty with Dmitri and the quick hands of a woman who could paste three hundred labels
  an hour, and worked the cannery line until the doors shut. The Liss label was a herring in a blue wave. She
  has redrawn it from memory forty times since, on the backs of Anselm's menus. She wants Nell to look at it and
  say it is right, because a co-op will need a label and Tilde has the only copy that is not on a tin. Nell says
  she will come and see it. She has said so for two springs.
