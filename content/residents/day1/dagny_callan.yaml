backstory: >
  Dagny came to Monde at forty-five with a daughter and a mill contract, and worked the Lissworth laundry
  mangles until the gates shut. The weir is under her window, and she has read it for twenty-three years: low
  and sulky means rain by Thursday, a clean white lip means the ferry will run. She says she is right nine times
  in ten. She wants a bench at the weir where she can read it sitting down, and has asked Kasimir twice. He
  says, "Give it a day." Svea, at his bench on Saturdays, has said nothing at all.
