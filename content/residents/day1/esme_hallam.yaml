backstory: Esme came to Monde at thirty-three, a city girl from Carrow who had married a cannery foreman named
  Walt. She sewed for the Liss Cannery's stitching room for twenty years, mending nets and then canvas aprons,
  and later took in alterations for the whole of Tower Lane. Walt drowned off the breakwater the winter before
  the cannery closed, and she never found his thermos on the jetty again, though she still counts it among the
  things that went missing. She tells everyone she stayed because the rent was low. The truth is she could not
  face the train back, and has not got over the shame of that.
