backstory: Grew up inland, where her father kept a mill and she learned to splice rope before she learned to
  read. Married young to a man who sold insurance in the city, and spent twenty years being very good at a
  life that did not suit her. When the marriage ended she took a train to the coast with one suitcase and a
  map she had torn from a library book. The boathouse on the Wharf needed someone who could caulk a seam, and
  nobody else in Monde could. She has never told anyone why she picked a town with no doctor. She thinks it
  was the smell of the water.
