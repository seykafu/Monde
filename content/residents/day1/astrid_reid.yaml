backstory: Astrid ran the sorting office in Hessle Cross for thirty years, weighing parcels and reading
  everyone's postmarks before they did. When her husband Tomas died, she could not bear the flat above the
  office, so she sold up and took the ferry to Monde at fifty-five, mostly because a notice in the Lantern
  said the terraces were cheap. She has been here twenty-one years and still thinks of the town as the place
  where the post comes late. She keeps Tomas's tin of barley sugar on the windowsill and eats one only on
  Sundays. Her one great regret is never learning to swim, which she blames on the ferry.
