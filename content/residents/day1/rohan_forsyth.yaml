backstory: >
  Rohan gutted on the cannery line from sixteen until the doors shut, and has stood at Nell's slab since: ice by
  five, scales at eight, the slab scrubbed by half past four. He says the weather first and the rest when
  someone makes him. He and Ebba pass on the harbour steps at six every evening, and have for eleven years. He
  wants Nell to hand him the co-op sheet first, not last, because the cannery was the only place anyone ever
  asked him first. Nell asks the loud ones first. He is not loud.
