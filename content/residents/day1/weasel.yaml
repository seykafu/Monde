backstory: >
  Weasel came off the Tuesday ferry six years ago, at twenty-two, with one rucksack and a letter of
  introduction to a cousin who had already left town. He ran errands for anyone who paid, then for the crew,
  because the crew paid on Saturdays. Now he carries the envelope to the crane yard, keeps the take in labelled
  jam jars, one to a shop, and hears everything said on Market Row, because a man in an apron is a man nobody
  sees. He calls the Saturday twenty the arrangement. He would like, once, to be called Wendell by somebody
  who isn't asking him for something.
