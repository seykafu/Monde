  and keeping trains honest. When the line thinned out he took early retirement and moved to Monde at sixty,
  following a cousin's letter about cheap rooms by the harbour. The cousin died two winters later, so Radek
  stayed on alone. He still hears the bell of a level crossing in his sleep. He believes the town will come
  back once someone fixes the station clock, and that the Tollmen are simply tidying up after bad weather. He
  reads the Lantern from first line to last and writes the corrections in pencil in the margins before he
  posts it back through a neighbour's door.
