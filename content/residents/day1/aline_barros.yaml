backstory: Aline worked the Lissworth Mill's spinning room until the year it started laying people off by the
  alphabet. She came to Monde at forty with a suitcase and a grudge, then took net-mending work from the
  fishermen who had never bothered to learn it. She has never been convinced by any scheme that involves a
  meeting, and she says so. Her brother's wages paid for the flat's rent through the lean years, and she has
  never let him forget she kept the books. She mends for half the harbour now and charges fairly, which nobody
  expects. She has not forgiven Monde for letting the cannery go, and she is not sure she has forgiven herself
  for staying.
