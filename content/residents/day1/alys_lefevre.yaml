backstory: Alys was born in the house on Terrace Row and sewed for the whole street for forty years, first at
  the mill's finishing room and then from her front parlour after the looms went quiet. She married Pierre
  Lefevre, a rigger from the harbour, and they had three children, two of whom went to Carrow and one who went
  further. Pierre died eight winters ago in his chair by the stove, and she has not been
  able to finish the quilt she started for him. She stayed because the street still knows her name and because
  leaving felt like admitting the town had finished with her.
