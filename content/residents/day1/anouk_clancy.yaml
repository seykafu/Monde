backstory: Anouk ran the drapery counter in Hessle Cross for eleven years and could tell a fake silk from
  across a room. She came to Monde at thirty-four to visit an aunt and stayed when the shop closed and the
  aunt left her the house on Mill Lane. Gaspard was the stranger on the ferry who asked her the time and then
  talked for an hour. She still believes everyone in Monde is honest, which is not quite true, as she has
  never once checked the change at Dunmore's. Her hands are never still and she is always mending something.
