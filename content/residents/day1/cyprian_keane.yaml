backstory: Cyprian was born in the Quay Street house and has fished out of Monde since he was fifteen, first
  as a deckhand on his uncle's crab boat, later as crew on the nine boats that still tie up at the harbour
  steps. His wife Maren went to Carrow twelve years ago for a job in the cold stores and never came back to
  live here; they still exchange letters on Tuesdays when the Gannet runs. He lost a finger in a winch three
  decades back and tells the story badly. He stayed because the bay is the only thing he has ever known well,
  and he believes the cannery closing was the sea's fault, not the company's.
