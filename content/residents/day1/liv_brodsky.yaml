  Liv has carried the Wharf's post for eleven years, since the post office shut, and keeps the chalk board at
  the ticket booth: the Gannet's days, the parcels waiting, whose letter has come. She says she has never read
  one. Thora takes Tuesday's ferry to Hessle Cross and comes home Friday, so the house runs on the Board, Liv's
  lists pinned to the kitchen door and amended by Leonie in pencil. Liv wants Moss to name one time for the
  Friday boat and hold it. She has chalked "about two" beside it for six winters, and she is running out of
  board.
