backstory: Birgit grew up above the draper's on Market Row and measured out ribbon for half the town before
  she married Henrik. She knew every family by its children's sizes and still does. When the Liss Cannery shut
  eleven years ago she took in sewing for the Carrow ferry girls, which paid poorly and kept her hands busy.
  She stays in Monde because her mother is buried in the St Brigid's yard, and because the Gull & Anchor needs
  someone to tell the young men to sit down. She believes the Saturday collectors are simply tax men with bad
  manners, when everyone she knows has quietly stopped asking what the money is for.
