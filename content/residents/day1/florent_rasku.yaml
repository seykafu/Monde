  second spring and nobody complained about it. He came to Monde at 23 because a Carrow agent wrote that the
  Commons had good soil and nobody using it. The soil was poor and the agent was a liar, but he stayed,
  learning the ground bed by bed. Thirteen years on he grows enough to sell and not enough to brag about. He
  still thinks the town will turn around by next spring, and he keeps a plot ready for the people who will
  come back to it.
