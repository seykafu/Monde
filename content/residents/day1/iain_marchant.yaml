backstory: Iain kept the wage ledgers at Lissworth Mill for almost twenty years, adding columns by hand while
  the looms clattered through the wall. He came to Monde at twenty-six with a suitcase and a letter of
  introduction, and he married Signe within a year. When the mill closed he sat with the final ledger for a
  whole afternoon before he could bring himself to shut it. He still does the household accounts in pencil and
  checks them twice, mostly out of habit. He believes the town will come back once the ferry timetable
  improves, and he says so at every opportunity. He is wrong about the ferry; the timetable was never the
  problem, and he knows it privately.
