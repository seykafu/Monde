backstory: Oona trained as a draughtswoman in a shipyard town and came to Monde at twenty-nine after a bad
  winter and a worse marriage. She rented the flat above Market Row for its north light and has built model
  ferries, schooners and the Gannet in miniature for thirty-one years. Her boats sell well by post, but she
  believes the town's children would love them more than collectors do, and she is wrong that she can afford
  to give them away. Kofi came the same year, and she still counts herself lucky he stayed.
