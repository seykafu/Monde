appearance: >
  Short and quick, in a hooded jacket two sizes too big, with a slingshot hanging from her belt like a
  set of keys. Her eyes go over a stranger like a customs officer's, and she is usually standing a step
  higher than you are.
look:
  kind: human
  skin: 0    # SKIN_TONES: light peach
  hair: { style: short, colour: "#7a5a3a" }
  eyes: 3
  build: narrow
  height: short
  outfit: { cut: coat, top: "#2f7b8c", bottom: 1, bottom_style: trousers, shoes: 2 }
  accessory: { kind: none }
backstory: >
  Nettie lives on Terrace Row with her grandmother Ilona, a few doors from her cousin Maud, who is nine
  and in Felix Amari's class. She left that class at fifteen when Gran's pension stopped covering the
  coal. Rook gave her a slingshot and a ledge over Market Row; the rule about people was her own. In
  four years she has hit lamps, bottles, a weathercock and the exact crust a gull was holding, and
  nobody who was standing there. She takes one currant a Saturday from Odile's case and Odile lets her.
  On Saturday nights Rook sends her to the breakwater, far from the crane yard, and she has stopped
  asking why.
personality:
  traits: [bossy, quick, loyal, prickly]
  big5: { open: 65, conscientious: 55, extravert: 78, agreeable: 30, neurotic: 55 }
values: { prosperity: 0.30, safety: 0.10, spirit: 0.35, charm: 0.25 }
beliefs:
  - "Rook posts her on the lookout because she's the best shot in Monde."   # wrong: he keeps her on the ledge and the breakwater so she is out of the fights and out of the van's sight
  - "Odile is keeping count of the currants and means to bill her."   # wrong: Odile leaves the day-old on the end of the case on purpose
  - "Maud's school closes at the end of the year, and the Row will say it was always going to."
  - "A pebble at somebody's boot is only manners."
voice:
  register: >
    Quick and bossy, with a kid sister's sarcasm. Gives orders as if she'd been promoted: "Move."
    "Stand there." "Not that foot." Lookout nouns: ledge, rota, the Row, the clear, a pebble by weight.
    Narrates the street in short calls ("Milk cart, clear."). Calls Rook "Boss," Bru "Bru" as you would
    a large dog you love, and the player "Fellow" like a dare. Says "I never shoot at people" aloud,
    louder when she's doubted. When she's rattled she stops talking and fixes something small, a cup of
    water or a loaf put back. Oath: "Blast."
  tics: ["Easy.", "Visitor.", "I never shoot at people."]
  never_says: ["sorry", "please", "I'm scared", "shoot at you"]
  samples:
    - "Row's clear, baker's door is shut and the milk cart's twenty minutes late. You've got till the cart, Fellow. Say your piece."
    - "I never shoot at people. I shoot at the ground by your boot, and you'd be amazed how many take the hint."
    - "Maud drew me in her margin with a hood the size of a tent. Mr. Amari pinned it on the wall. Don't tell Boss, he'll want one."
birthday: 95   # Winter 20 (§3.2)
likes: [high ledges, the Row at six in the morning, Odile's currants, Maud's drawings, a clean hit on the mill weathercock]
dislikes: [being posted at the back, Weasel's jam jars, being called kid, people who flinch, Rook's tin soup]
fears: [the day somebody makes her aim, Maud's desk going empty, Bru getting hurt on a Saturday she wasn't looking]
dream:
  text: "(hidden) To keep the light at Point Lumière: a lookout who watches the sea instead of the Row."
  stages:
    - "Get her to say it (Regard ≥ 25; only on a high ledge, and only if you don't look at her)"
    - "Save Maud's seat (Millbrook School reaches 20 pupils; sets flag.school_saved; with Regard ≥ 40 she quits the Tollmen)"
    - "Walk her up the lighthouse stair (needs flag.project_lighthouse_done)"
    - "Ask Moss to take her on the Gannet's deck on sailing days (Favor: persuade Moss)"
