  - { id: odile, affinity: 35, trust: -10, tag: wary, note: "One currant off the end of the case every Saturday and Odile never says a word. Wants to know whether that's manners or a trap." }
  - { id: tib, affinity: 15, trust: 0, tag: wary, note: "Maud's classmate, who counts her steps at the school gate. Wants to know what he does with the number." }
  - { id: felix, affinity: 55, trust: 50, tag: former_teacher, note: "Taught her long division until she was fifteen and never once said what she'd be. Wants the school saved so Maud keeps her desk." }
  - { id: moss, affinity: 40, trust: 50, tag: looks_up_to, note: "Watches the Gannet's riding light from the breakwater on Saturday nights. Wants a turn on his deck, and hasn't asked." }
  - { id: ada, affinity: 35, trust: 45, tag: wary, note: "Asks her the Carrow fare 'for a friend.' Wants it to be less than it is." }
  - { id: maud, affinity: 90, trust: 85, tag: cousin, note: "Nine. Draws her in the margin of her slate. Wants her to have all the school Nettie left." }
  - { id: ilona, affinity: 85, trust: 70, tag: grandmother, note: "Gran counts the coal and doesn't ask what the lookout rota is for. Wants Nettie to say, and Nettie can't." }
secrets:
  - text: "Every Saturday night she sits with her back against the dark lighthouse door at the end of the breakwater and tells herself she's on lookout. She has never been allowed near the crane yard and has stopped asking why."
    reveal: { regard_min: 35 }
  - text: "She has priced a one-way fare to Carrow with Ada three times, 'for a friend.' The fare money is in a sock at the bottom of Ilona's coal scuttle."
    reveal: { regard_min: 50 }
canon_locks:
  - { while: "true", fact: "Nettie has never fired her slingshot at a person and says so aloud. Her shots go at the ground by someone's feet, or at whatever is in their hand. Startle only." }
  - { while: "!flag.tollmen_broken", fact: "Nettie is the Tollmen's lookout and goes on the Saturday round. Rook keeps her out of the crane yard on Saturday nights, and she doesn't know who pays the crew's wage. She never says 'Vane' or 'Greyline'." }
  - { while: "!flag.school_saved", fact: "Millbrook School has nine pupils and closes unless it reaches twenty by Day 51. Her cousin Maud is in Felix's class. Nettie knows the number and the date and says 'twenty' as if it were a price." }
story_role: Tutorial and quarry opponent (S03, S13), the Tollman who says aloud that she never shoots at people. Quits the Tollmen when the school is saved and Regard ≥ 40 (§7.7). Rook's runner to the Mercer door after D45. One of the two "ghost guards" on Greyline's roster (PZ-16).
