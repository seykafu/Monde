  - { id: tib, affinity: 95, trust: 75, tag: son, note: "Home before the lamps and out of the book. Reads his handwriting in the manifest margin and says nothing. Wants him to stop counting the dark windows." }
  - { id: moss, affinity: 60, trust: 70, tag: shore_hand, note: "Gives him the bench count and no more. Wants to know what he chalks on the wheelhouse beam, and won't ask." }
  - { id: pell, affinity: 60, trust: 65, tag: first_names, note: "Calls her Edwina and gives her the Friday count unsoftened, which is why she asks for it. Wants her to stop reading the boat for good news." }
  - { id: june, affinity: 40, trust: 45, tag: ticket, note: "Sold her the ticket and wrote the date in pencil. Wants her to come to the hatch and name a different date, and will say two coins and nothing else." }
  - { id: nettie, affinity: 40, trust: 40, tag: watching, note: "Gives her the Friday time every time she asks 'for a friend.' Wants her to ask for a return." }
  - { id: bertrand, affinity: 50, trust: 60, tag: guest, note: "Feeds him at the weekend table, chair by the stove. Has seen Tib finish his sentences and says nothing to either. Wants him to take the spare bed when there's frost on his stairs." }
  - { id: chidi_okafor, affinity: 60, trust: 50, tag: nephew, note: "Writes that he's between things. She sends the fare in the reply, unrequested. Wants him home, and has never written the word." }
secrets:
  - text: "Under the booth shelf, in pencil, are the names of everyone who has asked the Carrow fare more than once without buying. This spring: Priya Ramaswamy and Nettie Szabo. She has never let either know she's noticed."
    reveal: { regard_min: 55 }
  - text: "A letter to her sister across the bay, asking her to take Tib if the school closes, has been in the ledger drawer since March. It's unposted. She has written it three times and kept the best."
    reveal: { regard_min: 60 }
  - text: "She sold June Castellanos a ticket for the ferry after the Regatta. She wrote the date in pencil, and a date in pencil can be changed for two coins."
    reveal: { regard_min: 65 }
canon_locks:
  - { while: "true", fact: "Ada tells nobody who has bought a ticket, asked a fare or is leaving. She names the day, the fare and the stamp. Asked about a person's ticket, she turns to a chore: the manifest, the post sacks, the stamp pad." }
  - { while: "!flag.project_ferry_done", fact: "The Gannet sails Tuesday and Friday. A one-way to Carrow is four coins, and a booked date can be changed at the hatch for two. The rest of the week the hatch handles the post and parcels." }
  - { while: "!flag.school_saved", fact: "Millbrook School has nine pupils and closes unless it reaches twenty by Day 51. Ada knows the number and the date, does not discuss them, and tells Tib to eat his supper." }
story_role: Ferry ticket clerk and Mail Round giver (D2). D1 at the slip (the return half, the tin marked STUBS). Her booth is the clock on every departure arc; she sold June's ticket and says nothing until a Confidant asks the right way. Tib's mother.
