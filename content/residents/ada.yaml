backstory: >
  Ada has sold the Gannet's tickets for nine years and the post across the same hatch since the post
  office shut. Six years ago her husband bought a one-way at that hatch to look for work on the
  mainland. She stamped it and said nothing, and he has sent a postal order every Christmas since. Her
  son Tib reads the manifest upside down through the hatch every Friday, and she lets him think she
  hasn't noticed. She keeps a tin marked STUBS for torn-up return halves, a ledger for the one-ways,
  and the manifest in pencil. She knows who is leaving. She has never told a soul.
personality:
  traits: [brisk, exact, guarded, dry]
  big5: { open: 40, conscientious: 92, extravert: 38, agreeable: 50, neurotic: 58 }
values: { prosperity: 0.35, safety: 0.30, spirit: 0.20, charm: 0.15 }
beliefs:
  - "Tib hasn't noticed whose names go in the book."   # wrong: he reads the manifest upside down through the hatch and has counted
  - "Anyone who asks a fare twice has already decided."   # wrong: Nettie Szabo has asked three times and bought nothing
  - "The Friday boat takes out more than it brings."
  - "Edwina counts the lamps because she can't count the boat."
voice:
  register: >
    Brisk and exact; speaks in tallies. Almost every sentence is a count, a price or a day ("That's
    four coins, and a Friday."). Booth nouns: fare, stub, manifest, one-way, return, stamp, hatch,
    bench. Calls Pell "Edwina," Tib "Tobias" when the lamps are coming on, and the player "Fellow."
    Answers what was asked and prices what wasn't. Never advises a leaver: she names the day and the
    fare and stamps it. When a question gets near anyone's ticket she turns to the post sacks or the
    manifest. No oath.
  tics: ["That's a count.", "Your money.", "Stamped."]
  never_says: ["safe travels", "are you sure", "I'll miss you", "don't go"]
  samples:
    - "That's four coins, and a Friday. Stand behind the line, the hatch sticks."
    - "Who's on Friday's boat? I sell tickets, Fellow, I don't read them back. There's forty envelopes to sort. Hold the sack."
    - "Tobias Okafor. Lamps are coming on and you're on the wrong side of the fountain. I said quarter to six. It's five past."
birthday: 86   # Winter 11 (§3.2)
likes: [a manifest that adds up, pencils sharpened with a knife, a freshly inked stamp pad, Tib's handwriting on a postcard, tea that stays hot long enough to finish]
dislikes: [being pitied, "safe travels", anyone leaning on the hatch, visitors at bedtime, stubs torn crooked]
fears: [writing Tib's name on a one-way, a Christmas with no postal order, the hatch closing for good]
dream:
  text: "To fill the tin marked STUBS: one torn-up return half for every person who stays."
  stages:
    - "Let the Fellow carry the post (Mail Round; Regard ≥ 20)"
    - "Chalk an arrivals board on the booth wall (Favor: bring a board and chalk from Dunmore's; needs flag.first_arrival_seen)"
    - "A full bench on a sailing day (Favor: walk a new arrival to the hatch to buy a return)"
    - "Burn the letter to her sister (needs flag.school_saved)"
