  - id: GR-074
    kind: greet
    when:
      r_exact:
        - Neighbor
      m:
        - bright
    text: "{player}! Good to see you. Walk with me a minute?"
    replies:
      - text: Gladly. Lead the way.
        intent: kind
      - text: Where are we going?
        intent: curious
      - text: Only if you set a slow pace.
        intent: joke
  - id: GR-075
    kind: greet
    when:
      r_exact:
        - Neighbor
      m:
        - glowing
    text: "{player}! Just the person. Everything's going right today."
    replies:
      - text: Good. You deserve a day like that.
        intent: kind
      - text: Just the person for what?
        intent: curious
      - text: Quick, before it changes its mind.
        intent: joke
  - id: GR-076
    kind: greet
    when:
      r_exact:
        - Friend
      m:
        - glum
    text: You came. Thank you. I'm poor company, but stay a bit.
    replies:
      - text: Of course. I'm not going anywhere.
        intent: kind
      - text: What's happened, {name}?
        intent: curious
      - text: Poor company is still company.
        intent: joke
  - id: GR-077
    kind: greet
    when:
      r_exact:
        - Friend
      m:
        - low
    text: "{player}. I'm glad it's you. Sit, if you've time."
    replies:
      - text: I've time. What's wrong?
        intent: kind
      - text: Has something happened?
        intent: curious
      - text: I always have time for a sit.
        intent: joke
  - id: GR-078
    kind: greet
    when:
      r_exact:
        - Friend
      m:
        - even
    text: "{player}! There you are. I was hoping you'd come by."
    replies:
      - text: I was hoping you'd be here.
        intent: kind
      - text: Oh? What's on your mind?
        intent: curious
      - text: I'm hard to keep away.
        intent: joke
  - id: GR-079
    kind: greet
    when:
      r_exact:
        - Friend
      m:
        - bright
    text: "{player}! I was just thinking about you. Come here."
    replies:
      - text: Good things, I hope.
        intent: kind
      - text: What were you thinking?
        intent: curious
      - text: Should my ears have been burning?
        intent: joke
  - id: GR-080
    kind: greet
    when:
      r_exact:
        - Friend
      m:
        - glowing
    text: "{player}! My favorite person in Monde today, and I mean it."
    replies:
      - text: That's kind. You're not bad yourself.
        intent: kind
      - text: What did I do to earn that?
        intent: curious
      - text: Only today? I'll take it.
        intent: joke
  - id: GR-081
    kind: greet
    when:
      r_exact:
        - Confidant
      m:
        - glum
    text: "{player}. Stay a while. I can't pretend with you."
    replies:
      - text: Then don't. I'm listening.
        intent: kind
      - text: What's going on?
        intent: curious
      - text: Good. I'm a terrible audience for pretending.
        intent: joke
  - id: GR-082
    kind: greet
    when:
      r_exact:
        - Confidant
      m:
        - low
    text: Oh, {player}. Good. I needed someone who wouldn't fuss.
    replies:
      - text: No fuss. Just a sit and a cup of tea.
        intent: kind
      - text: What do you need?
        intent: curious
      - text: I'll fuss quietly, then.
        intent: joke
  - id: GR-083
    kind: greet
    when:
      r_exact:
        - Confidant
      m:
        - even
    text: "{player}. How are you, really? Take your time."
    replies:
      - text: Honestly? Better for seeing you.
        intent: kind
      - text: Tired, but all right. And you?
        intent: curious
      - text: Really? I've lost a hat and found a friend.
        intent: joke
  - id: GR-084
    kind: greet
    when:
      r_exact:
        - Confidant
      m:
        - bright
    text: "{player}! Come here, you. It's been a good day, and it's better now."
    replies:
      - text: Mine too, now.
        intent: kind
      - text: Tell me about it.
        intent: curious
      - text: Careful. I'll start expecting this.
        intent: joke
  - id: GR-085
    kind: greet
    when:
      r_exact:
        - Confidant
      m:
        - glowing
    text: "{player}! Don't say a word yet. I've got such a day to tell you about."
    replies:
      - text: Not a word. Go on.
        intent: kind
      - text: Good day or strange day?
        intent: curious
      - text: (Mimes buttoning lips.)
        intent: joke
  - id: ST-001
    kind: talk
    when:
      m:
        - glum
    text: Everything takes more effort lately. Even this conversation, no offense.
  - id: ST-002
    kind: talk
    when:
      m:
        - glum
    text: Some days you just wait for them to end.
  - id: ST-003
    kind: talk
    when:
      m:
        - glum
    text: I keep meaning to cheer up. It keeps not happening.
  - id: ST-004
    kind: talk
    when:
      m:
        - glum
    text: Don't worry about me. I'll sort myself out by Thursday.
  - id: ST-005
    kind: talk
    when:
      m:
        - glum
    text: It's strange how loud a quiet street can be.
  - id: ST-006
    kind: talk
    when:
      m:
        - glum
    text: I'd tell you what's wrong, but it's mostly the weather in my head.
  - id: ST-007
    kind: talk
    when:
      m:
        - low
    text: Not terrible. Not great. Somewhere in the middle, wearing a coat.
  - id: ST-008
    kind: talk
    when:
      m:
        - low
    text: Slow week, this. I keep expecting something to happen.
  - id: ST-009
    kind: talk
    when:
      m:
        - low
    text: I'm all right. Tired, but all right.
  - id: ST-010
    kind: talk
    when:
      m:
        - low
    text: Funny how a small thing can sit on you all day.
  - id: ST-011
    kind: talk
    when:
      m:
        - low
    text: I'll feel better after one useful thing. Haven't picked it yet.
  - id: ST-012
    kind: talk
    when:
      m:
        - low
    text: Thanks for stopping. It helps, even when I'm poor company.
  - id: ST-013
    kind: talk
    when:
      m:
        - even
    text: Not much to report. Which, in Monde, is a kind of news.
    replies:
      - text: Quiet's not so bad.
        intent: kind
      - text: What would count as big news here?
        intent: curious
        next: ctx
      - text: "I'll put it in The Lantern: nothing happened."
        intent: joke
  - id: ST-014
    kind: talk
    when:
      m:
        - even
    text: I keep meaning to walk the whole town in one go.
    replies:
      - text: I'd come along, if you want company.
        intent: kind
      - text: Where would you start?
        intent: curious
      - text: I've done it twice. By accident.
        intent: joke
  - id: ST-015
    kind: talk
    when:
      m:
        - even
    text: It's a good town for noticing things. Slow enough to see them.
    replies:
      - text: I'm starting to notice that.
        intent: kind
      - text: What have you noticed lately?
        intent: curious
        next: ctx
      - text: I noticed the clock's stuck. Does that count?
        intent: joke
  - id: ST-016
    kind: talk
    when:
      m:
        - even
    text: Cat on the wall, gull on the post, nobody in a hurry.
    replies:
      - text: Sounds about perfect.
        intent: kind
      - text: Whose cat is that, anyway?
        intent: curious
      - text: I'm in no hurry either. I've no idea where I'm going.
        intent: joke
  - id: ST-017
    kind: talk
    when:
      m:
        - even
    text: Ask me something. I know about half the answers.
    replies:
      - text: What do you like best about living here?
        intent: kind
      - text: Who should I meet first?
        intent: curious
      - text: Which half?
        intent: joke
  - id: ST-018
    kind: talk
    when:
      m:
        - even
    text: Same as ever, really. Which is nice, some days.
    replies:
      - text: Same as ever sounds restful.
        intent: kind
      - text: And the other days?
        intent: curious
      - text: I'm still waiting for my first same-as-ever.
        intent: joke
  - id: ST-019
    kind: talk
    when:
      m:
        - bright
    text: I've had one of those mornings where everything fits.
  - id: ST-020
    kind: talk
    when:
      m:
        - bright
    text: Funny, isn't it? You get used to a place and it starts liking you back.
  - id: ST-021
    kind: talk
    when:
      m:
        - bright
    text: I've decided to be optimistic. It's cheaper than worrying.
  - id: ST-022
    kind: talk
    when:
      m:
        - bright
    text: Heard a good joke today. Can't remember it. Still pleased.
  - id: ST-023
    kind: talk
    when:
      m:
        - bright
    text: Monde's got something. I can't name it. I keep looking.
  - id: ST-024
    kind: talk
    when:
      m:
        - bright
    text: Tell me something good. I'll tell you something better.
    replies:
      - text: I found the bakery without asking. Twice.
        intent: kind
      - text: You first. What's better?
        intent: curious
      - text: "Something good: I'm here. Beat that."
        intent: joke
  - id: ST-025
    kind: talk
    when:
      m:
        - glowing
    text: I feel like I could carry the whole town on my back. Slowly.
  - id: ST-026
    kind: talk
    when:
      m:
        - glowing
    text: I don't know what's got into me, and I hope it stays.
  - id: ST-027
    kind: talk
    when:
      m:
        - glowing
    text: Everything looks different today. Better different. Do you see it too?
    replies:
      - text: I think I do. It's the light, maybe.
        intent: kind
      - text: What changed?
        intent: curious
      - text: I'm new. Everything looks different to me.
        intent: joke
  - id: ST-028
    kind: talk
    when:
      m:
        - glowing
    text: I've been smiling at strangers. Several smiled back. Wild.
  - id: ST-029
    kind: talk
    when:
      m:
        - glowing
    text: If I could bottle today, I'd sell it. Cheap. To everyone.
  - id: ST-030
    kind: talk
    when:
      m:
        - glowing
    text: I told the gulls good morning. One of them seemed to understand.
  - id: ST-031
    kind: talk
    when:
      r_exact:
        - Wary
    text: I'll be polite. That's the most I'm offering.
    replies:
      - text: Polite will do for now.
        intent: kind
      - text: What did I do to earn that?
        intent: curious
      - text: Fair. I'll earn the rest.
        intent: firm
  - id: ST-032
    kind: talk
    when:
      r_exact:
        - Wary
    text: People talk. I'll wait and see what's true.
    replies:
      - text: That's fair. I'd do the same.
        intent: kind
      - text: What are they saying about me?
        intent: curious
      - text: Watch, then. I'm not going anywhere.
        intent: firm
  - id: ST-033
    kind: talk
    when:
      r_exact:
        - Wary
    text: You'll have to earn a longer chat than this one.
    replies:
      - text: Then I'll start earning.
        intent: kind
      - text: How would I do that?
        intent: curious
      - text: Short and sweet, then. Good day.
        intent: leave
  - id: ST-034
    kind: talk
    when:
      r_exact:
        - Stranger
    text: Still finding my way around who's who. You?
    replies:
      - text: Same. I keep mixing up the faces.
        intent: kind
      - text: Who should I know first?
        intent: curious
      - text: I know the cat. That's a start.
        intent: joke
  - id: ST-035
    kind: talk
    when:
      r_exact:
        - Stranger
    text: We haven't properly met, have we? Not really.
    replies:
      - text: We haven't. I'm the new Fellow.
        intent: kind
      - text: What should I call you?
        intent: curious
      - text: Let's fix that, then. Hello.
        intent: joke
  - id: ST-036
    kind: talk
    when:
      r_exact:
        - Stranger
    text: What brings you out this way, {player}?
    replies:
      - text: Just getting to know the streets.
        intent: kind
      - text: Curiosity. What's worth seeing round here?
        intent: curious
        next: ctx
      - text: My feet, mostly. They've a mind of their own.
        intent: joke
  - id: ST-037
    kind: talk
    when:
      r_exact:
        - Neighbor
    text: It's nice, being on first-name terms with the street.
    replies:
      - text: It is. I'm getting there.
        intent: kind
      - text: Took a while, did it?
        intent: curious
      - text: I'm on first-name terms with three gulls.
        intent: joke
  - id: ST-038
    kind: talk
    when:
      r_exact:
        - Neighbor
    text: You've been about a lot. Folk have noticed. In a good way.
    replies:
      - text: That's good to hear.
        intent: kind
      - text: What are they saying?
        intent: curious
      - text: I'll try to be about less suspiciously.
        intent: joke
  - id: ST-039
    kind: talk
    when:
      r_exact:
        - Neighbor
    text: If you're ever short of sugar, you know where I am.
    replies:
      - text: Thank you. That's kind.
        intent: kind
      - text: Is that how it works here? Borrowing sugar?
        intent: curious
      - text: I'll be round tomorrow. With a very large bowl.
        intent: joke
  - id: ST-040
    kind: talk
    when:
      r_exact:
        - Friend
    text: Honestly, {player}, the town's better with you in it.
    replies:
      - text: That means a lot, {name}.
        intent: kind
      - text: What makes you say that?
        intent: curious
      - text: Don't tell the gulls. They'll get ideas.
        intent: joke
  - id: ST-041
    kind: talk
    when:
      r_exact:
        - Friend
    text: You can tell me things, you know. I'm good at keeping them.
    replies:
      - text: I know. Thank you.
        intent: kind
      - text: Do people tell you a lot?
        intent: curious
      - text: Then I'll find something worth keeping.
        intent: joke
  - id: ST-042
    kind: talk
    when:
      r_exact:
        - Friend
    text: I saved you a seat. Metaphorically. The real one was taken.
    replies:
      - text: Thanks. I'll take what I can get.
        intent: kind
      - text: Who's got the real one?
        intent: curious
      - text: I'll stand. I'm told it's good for me.
        intent: joke
  - id: ST-043
    kind: talk
    when:
      r_exact:
        - Confidant
    text: I trust you with the real answers, {player}. Don't make me regret it.
    replies:
      - text: You won't. I promise.
        intent: kind
      - text: Then tell me one.
        intent: curious
      - text: I won't let you down.
        intent: firm
  - id: ST-044
    kind: talk
    when:
      r_exact:
        - Confidant
    text: I'd tell you everything, if I could find the words and the hour.
    replies:
      - text: Take your time. I'll be here.
        intent: kind
      - text: Start with one thing?
        intent: curious
      - text: I've got an hour. The words are your job.
        intent: joke
  - id: ST-045
    kind: talk
    when:
      r_exact:
        - Confidant
    text: Whatever happens, I'm glad you came to Monde.
    replies:
      - text: So am I, {name}.
        intent: kind
      - text: What do you think will happen?
        intent: curious
      - text: Even with the fog and the gulls, so am I.
        intent: joke
  - id: ST-046
    kind: talk
    when: {}
    text: Hm.
  - id: ST-047
    kind: talk
    when: {}
    text: Right.
  - id: ST-048
    kind: talk
    when: {}
    text: Well. There it is.
  - id: ST-049
    kind: talk
    when: {}
    text: Mm-hm.
  - id: ST-050
    kind: talk
    when: {}
    text: Can't argue with that.
  - id: ST-051
    kind: talk
    when: {}
    text: Funny old day.
  - id: CX-001
    kind: ctx
    when:
      w:
        - sun
    text: Proper sun today. The whole town looks freshly washed.
  - id: CX-002
    kind: ctx
    when:
      w:
        - sun
    text: Sun's out. Even the gulls are being civil.
  - id: CX-003
    kind: ctx
    when:
      w:
        - sun
      m:
        - glum
        - low
    text: Bright out. Somehow that makes it worse. Don't mind me.
  - id: CX-004
    kind: ctx
    when:
      w:
        - sun
      m:
        - bright
        - glowing
    text: Look at that sky! Nobody could have a bad day under it.
  - id: CX-005
    kind: ctx
    when:
      w:
        - cloud
    text: Grey and soft today. Good weather for getting on with things.
  - id: CX-006
    kind: ctx
    when:
      w:
        - cloud
    text: The clouds can't make up their minds. Neither can I.
  - id: CX-007
    kind: ctx
    when:
      w:
        - cloud
      m:
        - glum
        - low
    text: Lid's on the sky again. Suits my mood, to be honest.
  - id: CX-008
    kind: ctx
    when:
      w:
        - cloud
      m:
        - bright
        - glowing
    text: Cloudy, but the kind with silver edges. I like those.
  - id: CX-009
    kind: ctx
    when:
      w:
        - rain
    text: Rain again. The gutters are getting their money's worth.
  - id: CX-010
    kind: ctx
    when:
      w:
        - rain
    text: Mind the puddles on {place}. Some are deeper than they look.
  - id: CX-011
    kind: ctx
    when:
      w:
        - rain
      m:
        - glum
        - low
    text: Rain on top of everything. Naturally.
  - id: CX-012
    kind: ctx
    when:
      w:
        - rain
      m:
        - bright
        - glowing
    text: I love a good rain. Everything smells like it's starting over.
  - id: CX-013
    kind: ctx
    when:
      w:
        - fog
    text: Can't see the end of the street. Walk like you mean it.
  - id: CX-014
    kind: ctx
    when:
      w:
        - fog
    text: Fog's in. Listen for the gulls and you'll find the Wharf.
  - id: CX-015
    kind: ctx
    when:
      w:
        - fog
      m:
        - glum
        - low
    text: Fog suits me today. Nobody can see my face.
  - id: CX-016
    kind: ctx
    when:
      w:
        - fog
      m:
        - bright
        - glowing
    text: Fog! The whole town's turned into a secret. I adore it.
  - id: CX-017
    kind: ctx
    when:
      w:
        - wind
    text: Wind's up. Hold your hat, and anything else you're fond of.
  - id: CX-018
    kind: ctx
    when:
      w:
        - wind
    text: That wind has opinions today. Mostly about hats.
  - id: CX-019
    kind: ctx
    when:
      w:
        - wind
      m:
        - glum
        - low
    text: Wind in my ears all day. I can't think straight.
  - id: CX-020
    kind: ctx
    when:
      w:
        - wind
      m:
        - bright
        - glowing
    text: Windy! Good for kites, washing and clearing the head.
  - id: CX-021
    kind: ctx
    when:
      w:
        - snow
    text: Snow. Everything's gone quiet, even the gulls.
  - id: CX-022
    kind: ctx
    when:
      w:
        - snow
    text: Mind your feet. Snow hides the cobbles but not the ice.
  - id: CX-023
    kind: ctx
    when:
      w:
        - snow
      m:
        - glum
        - low
    text: Snow's pretty. I'm just too cold to enjoy it.
  - id: CX-024
    kind: ctx
    when:
      w:
        - snow
      m:
        - bright
        - glowing
    text: Snow! Look at it. Nobody should be indoors for this.
  - id: CX-025
    kind: ctx
    when: {}
    text: Another day of {weather}. Monde takes what it's given.
  - id: CX-026
    kind: ctx
    when: {}
    text: Not complaining about the {weather}. Well, not out loud.
  - id: CX-027
    kind: ctx
    when:
      z:
        - old_quarter
    text: The Old Quarter's the only place where being lost looks like sightseeing.
  - id: CX-028
    kind: ctx
    when:
      z:
        - old_quarter
    text: Gas lamps, gulls and cobbles. You can almost hear the founder grumbling.
  - id: CX-029
    kind: ctx
    when:
      z:
        - old_quarter
      req:
        - "!flag.quarter_chime"
    text: The clocktower's stuck at 4:17. I still check it every time.
    replies:
      - text: So do I. It's a hard habit to break.
        intent: kind
      - text: Why did it stop, do you know?
        intent: curious
      - text: Right twice a day, at least.
        intent: joke
  - id: CX-030
    kind: ctx
    when:
      z:
        - old_quarter
      req:
        - flag.quarter_chime
    text: It struck once. I'm still hearing it, a little.
    replies:
      - text: I heard it too. Gave me shivers.
        intent: kind
      - text: Will it strike again, do you think?
        intent: curious
      - text: I nearly dropped my bread.
        intent: joke
  - id: CX-031
    kind: ctx
    when:
      z:
        - market_row
    text: Market Row smells of bread by seven. That never changes.
  - id: CX-032
    kind: ctx
    when:
      z:
        - market_row
    text: Striped awnings, wet cobbles, somebody arguing about cheese. Market Row in a sentence.
  - id: CX-033
    kind: ctx
    when:
      z:
        - market_row
      req:
        - storefront.empty>=1
    text: Plenty of empty storefronts here. I keep imagining what goes in them.
    replies:
      - text: Something with the lights on would do.
        intent: kind
      - text: What would you put in one?
        intent: curious
      - text: A shop that sells hats. I keep losing mine.
        intent: joke
  - id: CX-034
    kind: ctx
    when:
      z:
        - wharf
    text: The Wharf always smells of salt and rope. Worse things to smell of.
  - id: CX-035
    kind: ctx
    when:
      z:
        - wharf
    text: Those cranes have been rusting longer than I've been paying attention.
  - id: CX-036
    kind: ctx
    when:
      z:
        - wharf
      req:
        - "!project.lighthouse.done"
    text: The lighthouse sits dark on the breakwater. Somebody ought to fix that.
    replies:
      - text: Maybe somebody will.
        intent: kind
      - text: What would it take?
        intent: curious
      - text: Somebody might. Who do I ask?
        intent: firm
  - id: CX-037
    kind: ctx
    when:
      z:
        - wharf
      req:
        - project.lighthouse.done
    text: The lighthouse is lit again. I keep looking up to check.
  - id: CX-038
    kind: ctx
    when:
      z:
        - commons
    text: The Commons are overgrown but lovely. A garden that gave up and kept its manners.
  - id: CX-039
    kind: ctx
    when:
      z:
        - commons
    text: Duck pond's busy today. The ducks keep a schedule, at least.
  - id: CX-040
    kind: ctx
    when:
      z:
        - commons
    text: The Old Elm's been here longer than the town's complaints.
  - id: CX-041
    kind: ctx
    when:
      z:
        - millbrook
    text: Brick, boards and washing lines. Millbrook's still got plenty of home in it.
  - id: CX-042
    kind: ctx
    when:
      z:
        - millbrook
    text: You can hear the weir from half of Millbrook. It's company.
  - id: CX-043
    kind: ctx
    when:
      z:
        - millbrook
    text: Plenty of empty houses here. Every one's got a story and a damp patch.
  - id: CX-044
    kind: ctx
    when:
      z:
        - station_hill
    text: Station Hill's all wind and long views. You can see tomorrow's weather coming.
  - id: CX-045
    kind: ctx
    when:
      z:
        - station_hill
      req:
        - "!flag.station_open"
    text: Rails in the grass, signal box with its eyes shut. Still handsome.
  - id: CX-046
    kind: ctx
    when:
      z:
        - station_hill
    text: Come up here when you need to think. The wind does the rest.
  - id: CX-047
    kind: ctx
    when:
      z:
        - briar_woods
    text: Briar Woods is greener than it has any right to be. Mind the ferns.
  - id: CX-048
    kind: ctx
    when:
      z:
        - briar_woods
    text: Birdsong, fog, wet boots. The best sort of afternoon.
  - id: CX-049
    kind: ctx
    when:
      z:
        - briar_woods
    text: Stay on the path. Nothing sinister. Just brambles.
  - id: CX-050
    kind: ctx
    when:
      ev:
        - bloom_fair_eve
    text: Bloom Fair tomorrow. Everyone's pretending not to be excited.
  - id: CX-051
    kind: ctx
    when:
      ev:
        - bloom_fair
    text: Bloom Fair! Garlands on the Commons and nobody working. Perfect.
  - id: CX-052
    kind: ctx
    when:
      ev:
        - bloom_fair
    text: Have you seen the Commons? Flowers everywhere. Mind the bunting.
    replies:
      - text: I have. It's lovely.
        intent: kind
      - text: Who put all the flowers up?
        intent: curious
      - text: I've already walked into the bunting twice.
        intent: joke
  - id: CX-053
    kind: ctx
    when:
      ev:
        - regatta_eve
    text: Regatta tomorrow. Half the Wharf is polishing boats it won't admit it polished.
  - id: CX-054
    kind: ctx
    when:
      ev:
        - regatta
    text: Regatta day! Smell that fry oil? That's the smell of happiness.
  - id: CX-055
    kind: ctx
    when:
      ev:
        - regatta
    text: Boats on the bay and fish on the grill. What more could you want?
    replies:
      - text: Nothing. This is perfect.
        intent: kind
      - text: Which boat should I cheer for?
        intent: curious
      - text: A second helping, maybe.
        intent: joke
  - id: CX-056
    kind: ctx
    when:
      ev:
        - supper_eve
    text: Supper's tomorrow. I've been told to bring a dish. I'm panicking.
  - id: CX-057
    kind: ctx
    when:
      ev:
        - supper
    text: Harvest Supper! Long tables, long speeches, second helpings. Marvelous.
  - id: CX-058
    kind: ctx
    when:
      ev:
        - supper
    text: Everyone's here. Save yourself a chair before the pudding goes.
  - id: CX-059
    kind: ctx
    when:
      ev:
        - lantern_eve
    text: Tomorrow's Lantern Night. I've been polishing my lantern all week.
  - id: CX-060
    kind: ctx
    when:
      ev:
        - lantern_night
    text: It's Lantern Night. The whole town's in the square. Go and be counted.
  - id: CX-061
    kind: ctx
    when:
      ev:
        - lantern_night
    text: Lanterns by dusk, votes by dark. Don't go anywhere without a coat.
  - id: CX-062
    kind: ctx
    when:
      ev:
        - tollmen_near
    text: Tollmen on the corner again. I'd cross the street, if I were you.
  - id: CX-063
    kind: ctx
    when:
      ev:
        - tollmen_near
    text: Funny how quiet a street gets when they walk down it.
  - id: CX-064
    kind: ctx
    when:
      ev:
        - tollmen_near
      m:
        - glum
        - low
    text: Them again. I'm too tired to be angry, and that's the worst bit.
  - id: CX-065
    kind: ctx
    when:
      ev:
        - tollmen_near
      m:
        - even
    text: Don't stare, don't hurry. It annoys them more than you'd think.
  - id: CX-066
    kind: ctx
    when:
      ev:
        - tollmen_near
      m:
        - bright
        - glowing
    text: Not today, you lot. I'm in too good a mood to be bothered.
  - id: CX-067
    kind: ctx
    when:
      ev:
        - tollmen_near
    text: Eyes on the cobbles and coins in your boot. That's my advice.
  - id: CX-068
    kind: ctx
    when:
      ev:
        - project_done
    text: Did you see? Another one finished. The place is getting back on its feet.
    replies:
      - text: I did. It's good to see.
        intent: kind
      - text: What should we fix next?
        intent: curious
      - text: Next we'll get the clock going. Somehow.
        intent: joke
  - id: CX-069
    kind: ctx
    when:
      ev:
        - project_done
    text: They finished it, {player}. Just like that. I keep walking past to check.
  - id: CX-070
    kind: ctx
    when:
      ev:
        - project_done
      m:
        - glum
        - low
    text: I won't say it isn't good news. I'm just too tired to cheer.
  - id: CX-071
    kind: ctx
    when:
      ev:
        - project_done
      m:
        - bright
        - glowing
    text: It's done! I've been telling everyone. They're sick of me.
  - id: CX-072
    kind: ctx
    when:
      ev:
        - project_done
    text: Whatever you're doing, {player}, it's working. Don't stop yet.
  - id: CX-073
    kind: ctx
    when:
      ev:
        - project_done
    text: Look at that. I'd forgotten what finished looks like.
  - id: CX-074
    kind: ctx
    when:
      ev:
        - arrival_new
    text: New face in town. Did you see? Looked lost, in a good way.
    replies:
      - text: I'll say hello. I know the feeling.
        intent: kind
      - text: Where are they staying?
        intent: curious
      - text: Lost in a good way is how I'd put myself.
        intent: joke
  - id: CX-075
    kind: ctx
    when:
      ev:
        - arrival_new
    text: Someone new has moved in. We'll have to learn another name.
  - id: CX-076
    kind: ctx
    when:
      ev:
        - arrival_new
      m:
        - glum
        - low
    text: More people. That's something, I suppose. A little something.
  - id: CX-077
    kind: ctx
    when:
      ev:
        - arrival_new
      m:
        - bright
        - glowing
    text: A new neighbor! I'm going to bake something. Or buy something.
  - id: CX-078
    kind: ctx
    when:
      ev:
        - arrival_new
    text: Census is up, they say. I've started counting strangers on the street.
  - id: CX-079
    kind: ctx
    when:
      ev:
        - returnee_new
    text: Somebody's come home. You can tell from how people are walking.
  - id: CX-080
    kind: ctx
    when:
      ev:
        - returnee_new
    text: A face from the old days is back. The whole street's gone soft.
  - id: CX-081
    kind: ctx
    when:
      ev:
        - station_open
    text: The station's open! I keep going up the hill to look at it.
  - id: CX-082
    kind: ctx
    when:
      ev:
        - station_open
    text: A whistle on the hill again. Listen to that.
    replies:
      - text: It's a lovely sound.
        intent: kind
      - text: Where does the line run now?
        intent: curious
      - text: I'll never sleep through the morning again.
        intent: joke
  - id: CX-083
    kind: ctx
    when:
      ev:
        - station_open
      m:
        - glum
        - low
    text: Trains again. Good. Let's hope they keep stopping here.
  - id: CX-084
    kind: ctx
    when:
      ev:
        - station_open
      m:
        - bright
        - glowing
    text: A train! A real train! In Monde! Somebody pinch me, gently.
  - id: CX-085
    kind: ctx
    when:
      ev:
        - station_open
    text: The station's open. Now there's a way in and a way home.
  - id: CX-086
    kind: ctx
    when:
      ev:
        - station_open
