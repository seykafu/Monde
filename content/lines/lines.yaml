# Quiet Mode line library (GDD Appendix B.1–B.4). Selection rules: GDD B.1.
# `replies` (optional): 2–3 things the Fellow can say back to the line, each {text ≤ 90 characters, intent,
# next?: talk | ctx}, at most one goodbye (intent leave). {name} is the resident's first name, {player} the
# player's. `next: ctx` asks for the news. Lines without replies get them derived from their kind, tags and
# text (shared/src/replies.ts).
lines:
