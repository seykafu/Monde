    text: "{resident:bastien} is on the wall again. That cat has the best seat in {place}."
    replies:
      - text: He's earned it, I'd say.
        intent: kind
      - text: Does he belong to anyone?
        intent: curious
      - text: I'll ask him to budge up.
        intent: joke
  - id: CX-089
    kind: ctx
    when:
      z:
        - station_hill
      t:
        - dawn
        - morning
