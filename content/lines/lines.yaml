    replies:
      - text: It's good someone's looking out.
        intent: kind
      - text: Isn't it safe, then?
        intent: curious
      - text: I'll walk behind her and see.
        intent: joke
  - id: CX-091
    kind: ctx
    when:
      t:
        - dawn
        - morning
