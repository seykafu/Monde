# The Wharf (GDD §2.3): salt, rope, rusting cranes. The road comes down from Market Row to the quay; the
# shuttered Liss Cannery and the Calloways' bunkhouse up top, two rows of empty cottages to the west, the fish
# market's boards and net racks, the crane yard, Vane's trailer, the boathouse over its slipway, the harbour
# steps (the bottom one weedy, uncovered at low water: WF-1), the ferry slip, and the breakwater (+1) out to
# Point Lumiere's dark lighthouse. The Grey Bay fills the south and east. Zone format v2 (world/zoneFormat.ts).
