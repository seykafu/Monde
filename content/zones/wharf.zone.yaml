# The Wharf (GDD 2.3): salt, rope, rusting cranes. Wharf Road comes down from Market Row to the quay and runs
# straight onto the ferry slip, where Pell's bunting hangs between two lamps (S01a). The Liss comes down the
# west side past the fishermen's terraces on Net Lane and Quay Street (the Harbormaster's House and Nell's
# cottage among them) and opens into the harbour by the boathouse and its slipway. The fish market's net
# racks march inland from the quay (WF-2); the harbour steps go down into the water, the bottom one weedy
# (WF-1). East of the road: the shuttered Liss Cannery, the Calloways' bunkhouse, Vane's slick trailer and the
# crane yard. The Grey Bay fills the south and east, and the breakwater (+1) runs out from the shingle to
# Point Lumiere's dark lighthouse. Who lives where (town/occupancy.ts, A.1.3: the Wharf is thinning, 19
# households and 8 vacant homes): Nell, Old Moss in the boathouse, the Calloways' bunkhouse, four census
# households (home_01..04) among the empty cottages, and the Harbormaster's House standing empty until Vane buys
# it (Day 48, §9.5). The Gannet lies at the slip between sailings. Zone format v2 (world/zoneFormat.ts).
