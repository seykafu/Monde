# Greybox: building letters are solid; door coordinates are outside on the street.
# Gravel walks run from the Commons gate up the avenue to the bandstand, with a cross walk east–west.
id: commons
name: The Commons
size: [40, 30]
legend:
  ",": { terrain: grass }
  ".": { terrain: dirt }
  "~": { terrain: water, solid: true }
  "=": { terrain: wood }
  m: { terrain: mud }
  f: { terrain: forest }
  "|": { terrain: stone, obstacle: fence, solid: true }
  p: { terrain: stone, solid: true }
  o: { terrain: stone, elev: 1 }
  l: { terrain: stone, elev: 1, obstacle: pillar }
  x: { terrain: rubble, elev: 1, obstacle: rock }
  "*": { terrain: marble, obstacle: pillar }
  G: { terrain: wall, elev: 1, solid: true, building: glasshouse }
  T: { terrain: wall, elev: 1, solid: true, building: teo_cottage }
# "." gravel walks · m garden soil (the community garden's beds) · f deep shade under the Old Elm
# "|" the railing along Market Row, broken by the Commons gate: p are its posts (CM-1), each with a gate prop
# o the bandstand's octagonal base (+1) · l its legs still standing · x fallen legs and the collapsed roof
# "*" the sundial on its plinth; the Old Elm (the tree prop in the shade) stands to its north-east (CM-2)
# "~" the duck pond, two lobes joined by a channel · "=" the footbridge across the channel (CM-4)
