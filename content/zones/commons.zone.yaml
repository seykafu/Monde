# The Commons (GDD 2.3): overgrown, quiet, beautiful bones. The Liss comes in under the woodland edge, fills
# the duck pond's two lobes and runs under the footbridge between them (CM-4), then leaves by the south-west
# corner for Market Row. The broken Glasshouse stands at the head of the north walk; Teo's cottage, his shed
# and the community garden's six overgrown beds are in the north-east. The avenue climbs from the gate in the
# railing along Market Row (CM-1) to the collapsed bandstand on its round; the sundial lawn lies west of the
# avenue with the Old Elm north-east of the dial (CM-2), and the picnic lawn east of it. Zone format v2.
