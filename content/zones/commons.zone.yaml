# The Commons (GDD §2.3): overgrown, quiet, beautiful bones. The Glasshouse (broken panes) and Teo's cottage,
# the community garden's six beds (overgrown until the garden Project), the collapsed bandstand on its round
# (CM puzzles), the picnic lawn, the Old Elm north-east of the sundial (CM-2), the duck pond's two lobes and
# the footbridge over the channel between them (CM-4), and the railing along Market Row broken by the Commons
# gate (CM-1). Gravel walks run up the avenue from the gate and across. Zone format v2 (world/zoneFormat.ts).
