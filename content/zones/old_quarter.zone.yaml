# The Old Quarter (GDD 2.3): cobbles, gas lamps, gulls on gutters. The civic row on the High Street's north
# side, west to east: St Brigid's (the old bell by its gate, OQ-1), the Founder's House, the Town Hall, the
# stopped clocktower, the library, the Lantern, Bertrand's clock shop, the road to Station Hill, the
# Constabulary and Augusta's. Fountain Square opens south of the street, its dry fountain and bronze heron
# in the middle, lived-in houses on Heron Lane to the west and the empty terrace on Bell Row to the east. The
# road to Briar Woods runs south from the square past the green; Lamplighter Lane, the narrowest street, turns
# east off it, and the Lamplighter's Cottage is the last on the left (S01c). The High Street runs east to
# Market Row's bridge and west to the Millbrook road. Zone format v2 (world/zoneFormat.ts).
