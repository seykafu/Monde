# Market Row (GDD 2.3): half the shutters down, striped awnings. Market Street runs east from the Old Quarter's
# bridge over the Liss: Cafe Liss on the riverbank, the Gull & Anchor, the old ironmonger's (the Tollmen's
# bench outside), Dunmore's and Fournier & Fille on its north side, then the Market Cross, where Commons Lane
# goes north to the Commons gate and Wharf Road south to the quay; the covered Market Hall on the Cross (its
# west door nearest the Wharf road, PZ-04) and five empty shops east of it. The market's bare stalls stand on
# the flags south of the street; Lower Row behind them has three more empty shops (No. 9, MR-4). The back
# alley runs behind the north side (behind Cafe Liss, S16). Who lives where (town/occupancy.ts, A.1.3: Market
# Row's 19 homes are all lived in; its flats over the open shops count, the nine empty storefronts are shops,
# not homes): Odile over the bakery, Dunmore's flat over the store, Roz and the pub rooms over the Gull & Anchor,
# a census household over the café and seven on Lower Row (home_01..08). Half the shutters are down: the nine
# empty storefronts, numbered 1-9 on their doors; No. 9 still wears its ghost sign (MR-4). Zone format v2.
